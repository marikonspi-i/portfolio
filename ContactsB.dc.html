</h2>
<span style="position: absolute; right: 0; bottom: 56px; font-size: 13px; color: #6B6B6B">{{ hint }}</span>
<div aria-hidden="true" style="{{ cursorStyle }}"></div>
</div>
<div style="position: relative; margin: 46px -48px 0">

<script type="text/x-dc" data-dc-script data-props='{"vh":{"editor":null,"default":900},"hideNav":{"editor":null,"default":false},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) {
    super(p);
    this.w1 = 'Давайте'.split(''); this.w2 = 'поговорим'.split('');
    const n = this.w1.length + this.w2.length;
    const seed = (i) => { const x = Math.sin(i * 12.9898) * 43758.5453; return x - Math.floor(x); };
    this.scatter = Array.from({ length: n }, (_, i) => ({ x: (seed(i) - 0.5) * 900, y: (seed(i + 40) - 0.5) * 700, r: (seed(i + 80) - 0.5) * 120 }));
    this.state = { offs: this.scatter, active: false, assembled: false, cx: 0, cy: 0 };
    this.timer = 0;
  }
  componentDidMount() {
    this.timer = setTimeout(() => this.setState({ offs: this.scatter.map(() => ({ x: 0, y: 0, r: 0 })), assembled: true }), 250);
  }
  componentWillUnmount() { clearTimeout(this.timer); }
  renderVals() {
    const offs = this.state.offs;
    const slow = !this.state.assembled || !this.state.active;
    const mk = (ch, i) => {
      const o = offs[i] || { x: 0, y: 0, r: 0 };
      return { ch, i, style: 'display: inline-block; transform: translate(' + o.x.toFixed(1) + 'px, ' + o.y.toFixed(1) + 'px) rotate(' + o.r.toFixed(1) + 'deg); transition: transform ' + (slow ? '1.1s cubic-bezier(.16,1.3,.3,1) ' + (i * 0.035).toFixed(3) + 's' : '.45s cubic-bezier(.2,1.6,.4,1)') + '; will-change: transform' };
    };
    return {
      row1: this.w1.map((c, i) => mk(c, i)),
      row2: this.w2.map((c, i) => mk(c, i + this.w1.length)),
      hint: this.state.active ? '' : 'Проведите курсором по надписи',
      showNav: !this.props.hideNav, rootH: (this.props.vh || 900) + 'px',
      cursorStyle: 'position: absolute; left: ' + (this.state.cx - 80) + 'px; top: ' + (this.state.cy - 80) + 'px; width: 160px; height: 160px; border-radius: 80px; pointer-events: none; display: ' + (this.state.active ? 'block' : 'none') + '; background: radial-gradient(circle closest-side, rgba(120,170,245,0.95) 0%, rgba(159,197,255,0.75) 30%, rgba(187,214,255,0.35) 62%, rgba(187,214,255,0) 100%); mix-blend-mode: multiply',
      move: (e) => {
        const els = e.currentTarget.querySelectorAll('[data-l]');
        const box = e.currentTarget.getBoundingClientRect();
        const k = box.width / 1296 || 1;
        const R = 240;
        const next = this.state.offs.slice();
        els.forEach((el) => {
          const i = Number(el.getAttribute('data-l'));
          const o = next[i] || { x: 0, y: 0, r: 0 };
          const r = el.getBoundingClientRect();
          const cx = (r.left + r.width / 2) / k - o.x, cy = (r.top + r.height / 2) / k - o.y;
          const dx = cx - e.clientX / k, dy = cy - e.clientY / k;
          const d = Math.hypot(dx, dy) || 1;
          if (d > R) { next[i] = { x: 0, y: 0, r: 0 }; return; }
          const f = Math.pow(1 - d / R, 2) * 90;
          next[i] = { x: dx / d * f, y: dy / d * f, r: (dx > 0 ? 1 : -1) * f * 0.25 };
        });
        this.setState({ offs: next, active: true, cx: (e.clientX - box.left) / k, cy: (e.clientY - box.top) / k });
      },
      leave: () => this.setState({ offs: this.state.offs.map(() => ({ x: 0, y: 0, r: 0 })), active: false })
    };
  }
}
</script>
