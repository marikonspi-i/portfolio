<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Марина Спиридонова — Head of Design и арт-директор</title>
<meta name="description" content="Портфолио Марины Спиридоновой: брендинг, дизайн-системы, арт-дирекшн, ивент-дизайн и ритейл.">
<meta property="og:title" content="Марина Спиридонова — Head of Design и арт-директор">
<meta property="og:description" content="Брендинг, дизайн-системы, арт-дирекшн, ивент-дизайн и ритейл.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#FFFFFF">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><style>html,body{margin:0;background:#FFFFFF;overscroll-behavior:none}</style></helmet>
<div style="position: fixed; inset: 0; overflow: hidden; background: #FFFFFF">
<sc-if value="{{ mob }}" hint-placeholder-val="{{ false }}"><dc-import name="SiteMobile" hint-size="390px,844px"></dc-import></sc-if>
<sc-if value="{{ desk }}" hint-placeholder-val="{{ true }}"><div style="{{ scaleStyle }}"><dc-import name="Site" vh="{{ H }}" hint-size="1440px,972px"></dc-import></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = this.measure(); }
  measure() { const w = (typeof window !== 'undefined' && window.innerWidth) || 1440, h = (typeof window !== 'undefined' && window.innerHeight) || 900; return { w, h }; }
  componentDidMount() { this.onR = () => { const m = this.measure(); if (m.w !== this.state.w || m.h !== this.state.h) this.setState(m); }; window.addEventListener('resize', this.onR); window.addEventListener('orientationchange', this.onR); }
  componentWillUnmount() { window.removeEventListener('resize', this.onR); window.removeEventListener('orientationchange', this.onR); }
  renderVals() {
    const { w, h } = this.state, mob = w < 900;
    const s = Math.min(w / 1440, h / 880), H = Math.max(880, Math.round(h / s)), left = Math.max(0, Math.round((w - 1440 * s) / 2));
    return { mob, desk: !mob, H, scaleStyle: 'position: absolute; left: ' + left + 'px; top: 0; width: 1440px; height: ' + H + 'px; transform: scale(' + s.toFixed(4) + '); transform-origin: 0 0' };
  }
}
</script>
</body>
</html>
