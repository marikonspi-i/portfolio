.ab-draw{stroke-dasharray:600;animation:abDraw 1.4s cubic-bezier(.4,0,.2,1) both}

.ab-open{transform-box:fill-box;transform-origin:center;animation:abOpen 1.1s cubic-bezier(.2,.75,.25,1) both}

        stats: [{ n: '12+', t: 'сотрудников в команде' }, { n: '103%', t: 'средний Performance Management за 2 года' }],

  bringFront(id) {
    const c = this.state.open.find((o) => o.id === id);
    if (!c || c.z === this.zTop) return;
    const z = ++this.zTop;
    this.setState({ open: this.state.open.map((o) => o.id === id ? { ...o, z } : o) });
  }
  renderVals() {
    const S = this.skillsData();

          const x = Math.max(24, Math.min(1440 - s.w - 24, 72 + k * 216 + 108 - s.w / 2 + ((n % 3) - 1) * 40));
          const y = 90 + ((n * 47) % 140);
          const r = [-6, 4.5, -2, 6, -4.5, 2.5][k] * (n % 2 ? -0.8 : 1);

        btnStyle: 'min-height: 56px; padding: 0 8px; border: 0; background: transparent; color: #111111; font-family: Geologica, sans-serif; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer; text-decoration: ' + (isOpen ? 'underline; text-underline-offset: 6px' : 'none')
      };
    });
    const mob = !!this.props.mobile;
    const list = mob ? S.map((s, k) => ({ id: 100 + k, k, x: 0, y: 0, r: [-2.5, 2, -1.5, 2.5, -2, 1.5][k], z: 1 })) : open;
    const cards = list.map((c, z) => {
      const s = S[c.k];
      const fx = mob ? 0 : (72 + c.k * 216 + 108) - (c.x + s.w / 2);
      const fy = mob ? 140 : 900 - c.y;
      const mk = s.mask ? this._masks[s.mask] : '';
      const maskCss = mk ? '-webkit-mask: ' + mk + '; mask: ' + mk + ';' : '';
      const n = s.slides.length, si = Math.min(this.state.slide[c.id] || 0, n - 1), sl = s.slides[si];
      const focused = this.state.focus === c.id;
      const seg = (raw) => { let txt = raw.replace(/\]\s/g, ']\u00A0'); txt = txt.replace(/(?<=^|[\s(«])([А-Яа-яЁёA-Za-z]{1,3}) +/g, '$1\u00A0'); return txt.split(/(\[[^\]]+\])/).filter(Boolean).map((t) => t[0] === '[' ? { t: t.slice(1, -1), style: 'font-family: Lighthaus, Geologica, serif; font-size: 18px; line-height: 1; padding: 0 1px' } : { t, style: '' }); };

        visible: !c.closed, title: sl.title.replace(/(?<=^|\s)([А-Яа-яЁё]{1,3}) +/g, '$1\u00A0'), meta: sl.meta, link: sl.link, bg: s.bg, stats: (s.stats || []).map((x) => ({ n: x.n, t: x.t.replace(/(?<=^|\s)([А-Яа-яЁёA-Za-z0-9]{1,3}) +/g, '$1\u00A0') })),

        metaStyle: 'color: ' + (s.dark ? '#A8A6A0' : '#3A3A3A'),

                showPrev: focused && si > 0, showNext: focused && si < n - 1,
        prev: () => setSlide(si - 1), next: () => setSlide(si + 1),
        statN: "font-family: 'Lighthaus', 'Geologica', serif; font-size: " + (mob ? 50 : 72) + 'px; line-height: 0.9; white-space: nowrap',
        tabs: !!s.tabs, tabA: s.tabA || '', tabB: s.tabB || '',

        shapeStyle: 'position: relative; box-sizing: border-box; background: ' + s.bg + '; padding: ' + s.pad + '; border-radius: ' + s.radius + '; ' + (s.outline ? 'border: 1px solid #111111; ' : '') + maskCss,
        imgStyle: 'display: block; width: 100%; height: ' + s.imgH + 'px; object-fit: cover; border-radius: ' + s.imgR + '; pointer-events: none',

        close: () => this.setState({ open: this.state.open.map((o) => o.id === c.id ? { ...o, closed: true } : o) }),
        down: (e) => {

          if (this.state.focus !== c.id) this.setState({ focus: c.id });

        move: (e) => {
          const d = this.drag; if (!d || d.id !== c.id) return;

          this.setState({ open: this.state.open.map((o) => o.id === c.id ? { ...o, x: nx, y: ny } : o) });
        },
        up: () => { this.drag = null; }
      };
    });
    return { skills, cards, mob, stop: (e) => e.stopPropagation(), showNav: !this.props.hideNav && !mob, showSweep: !this.state.touched,
      rootStyle: mob ? "position: relative; width: 100%; box-sizing: border-box; padding: 20px 0 8px; background: #FFFFFF; color: #111111; font-family: 'Geologica', sans-serif; overflow: hidden" : "position: relative; width: 1440px; height: 900px; box-sizing: border-box; padding: 40px 72px 0; background: #FFFFFF; color: #111111; font-family: 'Geologica', sans-serif; overflow: hidden; touch-action: none",
      photoStyle: mob ? 'position: relative; width: 200px; height: 262px; margin: 4px auto 0; transform: rotate(-3deg)' : 'position: absolute; left: 590px; top: 160px; width: 260px; height: 340px; transform: rotate(-3deg)',
      h1Style: mob ? "position: relative; margin: -42px 12px 0; text-align: center; font-family: 'Lighthaus', 'Manrope', serif; font-weight: 400; font-size: 42px; line-height: 0.98" : "position: absolute; left: 162px; right: 72px; top: 403px; margin: 0; text-align: center; font-family: 'Lighthaus', 'Manrope', serif; font-weight: 400; font-size: 118px; line-height: 0.95; width: 1092px",
      stripStyle: mob ? 'display: flex; align-items: flex-start; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; padding: 22px 20px 34px; scrollbar-width: none; -webkit-overflow-scrolling: touch' : 'display: contents',
